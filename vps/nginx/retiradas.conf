# Config real do vhost principal (retiradas.tech), copiada de
# /etc/nginx/sites-available/retiradas na VPS em 2026-09-09 apos o
# incidente do CSP (ver abaixo). Mantida aqui so como referencia — a
# fonte de verdade que roda em producao continua sendo o arquivo na VPS
# (nao gerenciado pelo pipeline de deploy). Se o servidor precisar ser
# reprovisionado, comece por este arquivo.
#
# Incidente 2026-09-09: /painel, /painel/mapa, /painel/match, /aa-sempre e
# /acompanhamento/financeiro comecaram a mostrar a tela de erro (React
# ErrorBoundary, nao um 500 real do servidor) para todo mundo. Causa raiz:
# o CSS de src/pages/PainelPublico/styles/base.css carrega a fonte do
# Google via `@import url(https://fonts.googleapis.com/...)`; o
# `style-src` do CSP abaixo so tinha 'self' e 'unsafe-inline', sem esse
# dominio. O navegador bloqueava o @import, o mecanismo de preload de CSS
# do Vite tratava isso como falha de carregamento do chunk, e o
# ErrorBoundary da aplicacao mostrava a tela de "Erro 500" no lugar do
# painel. Corrigido adicionando `https://fonts.googleapis.com` ao
# `style-src` (ja aplicado abaixo). Se o CSS um dia trocar de fonte/deixar
# de usar Google Fonts, essa excecao pode ser removida.
server {
	server_name retiradas.tech www.retiradas.tech;

	server_tokens off;

	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
	client_max_body_size 200M;

	root /var/www/retiradas/dist;
	index index.html;

	location /api/ {
		proxy_pass http://127.0.0.1:3001/api/;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}

	listen 443 ssl; # managed by Certbot
	ssl_certificate /etc/letsencrypt/live/retiradas.tech/fullchain.pem; # managed by Certbot
	ssl_certificate_key /etc/letsencrypt/live/retiradas.tech/privkey.pem; # managed by Certbot
	include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
	if ($host = www.retiradas.tech) {
		return 301 https://$host$request_uri;
	} # managed by Certbot

	if ($host = retiradas.tech) {
		return 301 https://$host$request_uri;
	} # managed by Certbot

	listen 80;
	server_name retiradas.tech www.retiradas.tech;

	return 404; # managed by Certbot
}
