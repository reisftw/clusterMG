server {
	server_name retiradas.tech www.retiradas.tech;
	server_tokens off;
	client_max_body_size 200M;

	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

	root /var/www/retiradas/dist;
	index index.html;

	location /assets/ {
		try_files $uri =404;
		access_log off;
		expires 1y;
	}

	location = /sw.js {
		try_files $uri =404;
		expires -1;
	}

	location = /manifest.webmanifest {
		try_files $uri =404;
		expires -1;
	}

	location /api/ {
		proxy_pass http://127.0.0.1:3001/api/;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location / {
		expires -1;
		try_files $uri $uri/ /index.html;
	}
}

server {
	listen 80;
	server_name retiradas.tech www.retiradas.tech;
	return 301 https://retiradas.tech$request_uri;
}

