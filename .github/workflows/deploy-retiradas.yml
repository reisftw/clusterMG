name: Prepare Retiradas Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Versao rastreavel da release, por exemplo v1.2.0"
        required: true
        type: string

concurrency:
  group: release-retiradas
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Build verified Retiradas release candidate
    runs-on: ubuntu-latest
    environment: release-retiradas

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: retiradas_test
          POSTGRES_PASSWORD: retiradas_test
          POSTGRES_DB: retiradas_observability_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retiradas_test -d retiradas_observability_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/retiradas/backend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix apps/retiradas/backend --no-audit --no-fund

      - name: Validate release candidate
        run: |
          npm run lint:retiradas
          npm run test:retiradas
          npm run test:contracts

      - name: Validate observability migration on PostgreSQL
        env:
          OBSERVABILITY_TEST_DATABASE_URL: postgres://retiradas_test:retiradas_test@127.0.0.1:5432/retiradas_observability_test
        run: node --test apps/retiradas/backend/sql/113_observability_wave0.integration.test.js

      - name: Build production candidate
        run: |
          export VITE_APP_ENV_LABEL="Producao"
          export VITE_APP_VERSION="${GITHUB_SHA::7}"
          npm run build:retiradas

      - name: Package candidate
        run: |
          tar -czf retiradas-frontend.tar.gz dist
          tar \
            --exclude="apps/retiradas/backend/node_modules" \
            --exclude="apps/retiradas/backend/output" \
            --exclude="apps/retiradas/backend/.env" \
            -czf retiradas-backend.tar.gz \
            apps/retiradas/backend ops/vm-migration/vendor
          sha256sum retiradas-frontend.tar.gz retiradas-backend.tar.gz > SHA256SUMS.txt

      - name: Write release metadata
        env:
          RELEASE_PRODUCT: retiradas
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: >-
          node ops/release-metadata.mjs --product "$RELEASE_PRODUCT" --version
          "$RELEASE_VERSION" --checksums SHA256SUMS.txt --output release-manifest.json

      - name: Upload release artifact
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: retiradas-release
          if-no-files-found: error
          retention-days: 30
          path: |
            retiradas-frontend.tar.gz
            retiradas-backend.tar.gz
            SHA256SUMS.txt
            release-manifest.json

      - name: Publication adapter status
        run: |
          echo "Release candidate prepared."
          echo "The production publication job will run only from master."

  publish:
    name: Publish Retiradas to production
    needs: prepare
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production-retiradas

    permissions:
      contents: read

    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '145.223.27.204' }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      VPS_DEPLOY_ROOT: /var/www/retiradas
      VPS_BACKEND_ROOT: /opt/retiradas/vps
      REMOTE_FRONTEND_PACKAGE: /tmp/retiradas-frontend-${{ github.sha }}.tar.gz
      REMOTE_BACKEND_PACKAGE: /tmp/retiradas-backend-${{ github.sha }}.tar.gz
      REMOTE_RELEASE_MANIFEST: /tmp/retiradas-release-${{ github.sha }}.json

    steps:
      - name: Checkout verified revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Rebuild verified production revision
        run: |
          export VITE_APP_ENV_LABEL="Producao"
          export VITE_APP_VERSION="${GITHUB_SHA::7}"
          npm run build:retiradas

      - name: Package and checksum production release
        run: |
          tar -czf retiradas-frontend.tar.gz dist
          tar \
            --exclude="apps/retiradas/backend/node_modules" \
            --exclude="apps/retiradas/backend/output" \
            --exclude="apps/retiradas/backend/.env" \
            -czf retiradas-backend.tar.gz \
            apps/retiradas/backend ops/vm-migration/vendor
          sha256sum retiradas-frontend.tar.gz retiradas-backend.tar.gz > SHA256SUMS.txt
          node ops/release-metadata.mjs \
            --product retiradas \
            --version "${{ inputs.release_version }}" \
            --checksums SHA256SUMS.txt \
            --output release-manifest.json

      - name: Verify artifact checksums
        run: sha256sum -c SHA256SUMS.txt

      - name: Configure production SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST" || (echo "Missing VPS_HOST" && exit 1)
          test -n "$SSH_PRIVATE_KEY" || (echo "Missing VPS_SSH_KEY" && exit 1)
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          install -m 600 .github/known_hosts/retiradas ~/.ssh/known_hosts

      - name: Upload verified release packages
        run: |
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" \
            -o StrictHostKeyChecking=yes \
            -o HostKeyAlias=retiradas-production \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            retiradas-frontend.tar.gz \
            "$VPS_USER@$VPS_HOST:$REMOTE_FRONTEND_PACKAGE"
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" \
            -o StrictHostKeyChecking=yes \
            -o HostKeyAlias=retiradas-production \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            retiradas-backend.tar.gz \
            "$VPS_USER@$VPS_HOST:$REMOTE_BACKEND_PACKAGE"
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" \
            -o StrictHostKeyChecking=yes \
            -o HostKeyAlias=retiradas-production \
            release-manifest.json \
            "$VPS_USER@$VPS_HOST:$REMOTE_RELEASE_MANIFEST"

      - name: Publish backend and migrations with rollback
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          safe_version="$(printf '%s' "$RELEASE_VERSION" | tr -cs 'A-Za-z0-9._-' '-')"
          release_id="${safe_version}-${GITHUB_SHA::7}"
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" \
            -o StrictHostKeyChecking=yes \
            -o HostKeyAlias=retiradas-production \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "$VPS_USER@$VPS_HOST" \
            bash -s -- \
              "$VPS_BACKEND_ROOT" \
              "$release_id" \
              "$REMOTE_BACKEND_PACKAGE" <<'REMOTE'
          set -Eeuo pipefail

          backend_root="$1"
          release_id="$2"
          backend_package="$3"
          backup_root="/opt/retiradas/backend-rollbacks"
          backup_file="$backup_root/${release_id}.tar.gz"
          staging="$(mktemp -d /tmp/retiradas-backend-stage.XXXXXX)"
          deployed=0
          dependencies_switched=0
          previous_node_modules="$backup_root/${release_id}-node_modules"

          cleanup() {
            rm -rf "$staging"
          }
          rollback() {
            if [ "$deployed" -eq 1 ] && [ -s "$backup_file" ]; then
              tar -xzf "$backup_file" -C "$backend_root"
              if [ "$dependencies_switched" -eq 1 ] && [ -d "$previous_node_modules" ]; then
                rm -rf "$backend_root/node_modules"
                mv "$previous_node_modules" "$backend_root/node_modules"
              fi
              systemctl restart retiradas-api.service
              echo "Rollback do backend concluido: $backup_file" >&2
            fi
            cleanup
          }
          trap rollback ERR
          trap cleanup EXIT

          test -s "$backend_package"
          mkdir -p "$backup_root"
          tar \
            --exclude='./node_modules' \
            --exclude='./output' \
            --exclude='./uploads' \
            --exclude='./private' \
            -czf "$backup_file" -C "$backend_root" .

          tar -xzf "$backend_package" -C "$staging"
          source_root="$staging/apps/retiradas/backend"
          test -s "$source_root/package.json"
          test -s "$source_root/api/src/index.js"
          test -s "$source_root/sql/078_tecnico_dashboard_tentativas.sql"

          if ! cmp -s "$source_root/package-lock.json" "$backend_root/package-lock.json"; then
            npm ci --prefix "$source_root" --omit=dev --no-audit --no-fund
            rm -rf "$previous_node_modules"
            mv "$backend_root/node_modules" "$previous_node_modules"
            mv "$source_root/node_modules" "$backend_root/node_modules"
            dependencies_switched=1
          fi

          tar -cf - -C "$source_root" . | tar -xf - -C "$backend_root"
          deployed=1

          set -a
          . /etc/retiradas/api.env
          set +a
          cd "$backend_root"
          npm run migrate:sql
          systemctl restart retiradas-api.service
          curl -fsS --retry 15 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:3001/api/health >/dev/null

          deployed=0
          rm -f "$backend_package"
          find "$backup_root" -mindepth 1 -maxdepth 1 -mtime +30 -exec rm -rf {} +
          echo "Backend ativo: $release_id"
          REMOTE

      - name: Publish atomically with rollback
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          safe_version="$(printf '%s' "$RELEASE_VERSION" | tr -cs 'A-Za-z0-9._-' '-')"
          release_id="${safe_version}-${GITHUB_SHA::7}"
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" \
            -o StrictHostKeyChecking=yes \
            -o HostKeyAlias=retiradas-production \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "$VPS_USER@$VPS_HOST" \
            bash -s -- \
              "$VPS_DEPLOY_ROOT" \
              "$release_id" \
              "$REMOTE_FRONTEND_PACKAGE" \
              "$REMOTE_RELEASE_MANIFEST" <<'REMOTE'
          set -Eeuo pipefail

          deploy_root="$1"
          release_id="$2"
          frontend_package="$3"
          release_manifest="$4"
          releases_root="$deploy_root/releases"
          release_root="$releases_root/$release_id"
          active_path="$deploy_root/dist"
          next_link="$deploy_root/.dist-next"
          previous_target=""
          switched=0

          rollback() {
            if [ "$switched" -eq 1 ] && [ -n "$previous_target" ] && [ -d "$previous_target" ]; then
              rm -f "$active_path"
              ln -s "$previous_target" "$active_path"
              nginx -t
              systemctl reload nginx
              echo "Rollback concluido para $previous_target" >&2
            fi
          }
          trap rollback ERR

          mkdir -p "$release_root"
          tar -xzf "$frontend_package" -C "$release_root"
          test -s "$release_root/dist/index.html"
          cp "$release_manifest" "$release_root/release-manifest.json"
          chown -R www-data:www-data "$release_root"

          if [ -L "$active_path" ]; then
            previous_target="$(readlink -f "$active_path")"
          elif [ -d "$active_path" ]; then
            previous_root="$releases_root/pre-github-$(date +%Y%m%d%H%M%S)"
            mkdir -p "$previous_root"
            mv "$active_path" "$previous_root/dist"
            previous_target="$previous_root/dist"
          fi

          printf '%s\n' "$previous_target" > "$release_root/PREVIOUS_RELEASE"
          rm -f "$next_link"
          ln -s "$release_root/dist" "$next_link"
          mv -Tf "$next_link" "$active_path"
          switched=1

          nginx -t
          systemctl reload nginx
          curl -fsS --retry 5 --retry-delay 2 https://retiradas.tech/ >/dev/null
          curl -fsS --retry 5 --retry-delay 2 https://retiradas.tech/api/health >/dev/null

          switched=0
          rm -f "$frontend_package" "$release_manifest"
          echo "Release ativa: $release_root"
          REMOTE
