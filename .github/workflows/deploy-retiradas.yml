name: Prepare Retiradas Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Build verified Retiradas release candidate
    runs-on: ubuntu-latest
    environment: release-retiradas

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/retiradas/backend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix apps/retiradas/backend --no-audit --no-fund

      - name: Validate release candidate
        run: |
          npm run lint:retiradas
          npm run test:retiradas
          npm run test:contracts

      - name: Build production candidate
        run: |
          export VITE_APP_ENV_LABEL="Producao"
          export VITE_APP_VERSION="${GITHUB_SHA::7}"
          npm run build:retiradas

      - name: Package candidate
        run: |
          tar -czf retiradas-frontend.tar.gz dist
          tar \
            --exclude="apps/retiradas/backend/node_modules" \
            --exclude="apps/retiradas/backend/output" \
            --exclude="apps/retiradas/backend/.env" \
            -czf retiradas-backend.tar.gz apps/retiradas/backend
          sha256sum retiradas-frontend.tar.gz retiradas-backend.tar.gz > SHA256SUMS.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: retiradas-release
          if-no-files-found: error
          retention-days: 30
          path: |
            retiradas-frontend.tar.gz
            retiradas-backend.tar.gz
            SHA256SUMS.txt

      - name: Publication adapter status
        run: |
          echo "Release candidate prepared."
          echo "No production host was changed by this workflow."
          echo "Enable a reviewed, protected publication adapter before using this artifact to deploy."
