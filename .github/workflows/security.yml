name: Security Checks

on:
  pull_request:
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - ".github/workflows/security.yml"
  push:
    branches:
      - master
      - retiradas
      - mercado
      - operacao
      - homolog-dev
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - "."
          - "apps/retiradas/backend"
          - "apps/operacao/frontend"
          - "apps/operacao/backend"

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix "${{ matrix.project }}" --no-fund

      - name: Audit high and critical dependencies
        run: npm audit --prefix "${{ matrix.project }}" --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Scan repository history and changes
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
