name: CI Retiradas

on:
  pull_request:
    paths:
      - "apps/retiradas/**"
      - "ops/**"
      - "scripts/**"
      - "tests/contracts/**"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.js"
      - ".github/workflows/ci-retiradas.yml"
      - ".github/workflows/deploy-retiradas.yml"
      - ".github/workflows/publish-retiradas-android.yml"
  push:
    branches:
      - master
      - retiradas
      - homolog-dev
      - "feature/**"
      - "fix/**"
      - "hotfix/**"
      - "chore/**"
    paths:
      - "apps/retiradas/**"
      - "ops/**"
      - "scripts/**"
      - "tests/contracts/**"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.js"
      - ".github/workflows/ci-retiradas.yml"
      - ".github/workflows/deploy-retiradas.yml"
      - ".github/workflows/publish-retiradas-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Retiradas
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: retiradas_test
          POSTGRES_PASSWORD: retiradas_test
          POSTGRES_DB: retiradas_observability_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retiradas_test -d retiradas_observability_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/retiradas/backend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix apps/retiradas/backend --no-audit --no-fund

      - name: Lint Retiradas
        run: npm run lint:retiradas

      - name: Test Retiradas
        run: npm run test:retiradas

      - name: Test critical backend regressions
        run: >-
          node --test
          apps/retiradas/backend/api/src/dashboardReadPath.test.js
          apps/retiradas/backend/api/src/staleWhileRevalidateCache.test.js
          apps/retiradas/backend/api/src/notificationsService.test.js
          apps/retiradas/backend/api/src/mapSyncUpdatesService.test.js
          apps/retiradas/backend/api/src/mapsV2/mapsV2Service.test.js
          apps/retiradas/backend/api/src/hubsoftSyncProfiles.storeClassification.test.js

      - name: Validate observability migration on PostgreSQL
        env:
          OBSERVABILITY_TEST_DATABASE_URL: postgres://retiradas_test:retiradas_test@127.0.0.1:5432/retiradas_observability_test
        run: >-
          node --test
          apps/retiradas/backend/sql/113_observability_wave0.integration.test.js
          apps/retiradas/backend/sql/119_performance_indexes.integration.test.js
          apps/retiradas/backend/sql/120_maintenance_visit_metrics.integration.test.js
          apps/retiradas/backend/sql/121_integrated_p0_reliability.integration.test.js
          apps/retiradas/backend/sql/124_tentativas_bairro_solicitacoes.integration.test.js
          apps/retiradas/backend/scripts/run-sql-migrations.integration.test.js

      - name: Validate workflow contracts
        run: npm run test:contracts

      - name: Build Retiradas
        run: |
          export VITE_APP_ENV_LABEL="CI"
          export VITE_APP_VERSION="${GITHUB_SHA::7}"
          npm run build:retiradas
