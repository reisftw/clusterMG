name: Diagnose Retiradas Production

on:
  workflow_dispatch:
    inputs:
      route_id:
        description: Route UUID to inspect (optional)
        required: false
        type: string
      verify_route_optimization:
        description: Execute the deployed optimizer for the inspected route
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '145.223.27.204' }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure production SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/diagnostic_key
          chmod 600 ~/.ssh/diagnostic_key
          install -m 600 .github/known_hosts/retiradas ~/.ssh/known_hosts

      - name: Read sanitized production diagnostics
        env:
          ROUTE_ID: ${{ inputs.route_id }}
          VERIFY_ROUTE_OPTIMIZATION: ${{ inputs.verify_route_optimization }}
        run: |
          ssh -i ~/.ssh/diagnostic_key -p "$VPS_PORT" \
            -o StrictHostKeyChecking=yes \
            -o HostKeyAlias=retiradas-production \
            "$VPS_USER@$VPS_HOST" \
            bash -s -- "$ROUTE_ID" "$VERIFY_ROUTE_OPTIMIZATION" <<'REMOTE'
          set -Eeuo pipefail
          route_id="${1:-}"
          verify_route_optimization="${2:-false}"
          set -a
          . /etc/retiradas/api.env
          set +a
          database_target="${DATABASE_URL:-${PGDATABASE:-retiradas}}"

          echo "=== API ==="
          systemctl is-active retiradas-api.service
          curl -fsS http://127.0.0.1:3001/api/health
          echo

          echo "=== API 5xx by route (last 24 hours) ==="
          psql "$database_target" -X -v ON_ERROR_STOP=1 -P pager=off -c \
            "select method, route,
                    sum(errors_5xx)::bigint as errors_5xx,
                    sum(requests)::bigint as requests,
                    max(last_error_code) as last_error_code
               from maintenance_route_metrics_hourly
              where bucket_start >= now() - interval '24 hours'
              group by method, route
             having sum(errors_5xx) > 0
              order by errors_5xx desc, requests desc;"

          echo "=== API 5xx timeline (last 24 hours) ==="
          psql "$database_target" -X -v ON_ERROR_STOP=1 -P pager=off -c \
            "select bucket_start, route, errors_5xx, requests
               from maintenance_route_metrics_hourly
              where bucket_start >= now() - interval '24 hours'
                and errors_5xx > 0
              order by bucket_start desc, errors_5xx desc;"

          echo "=== Deployed Maps health self-check ==="
          cd /opt/retiradas/vps/api
          node -e '
            const db = require("./src/db");
            const maps = require("./src/mapsV2/mapsV2Service");
            maps.getHealth()
              .then((result) => console.log(JSON.stringify({ ok: result.ok, reconciliation: result.reconciliation?.available !== false })))
              .catch((error) => { console.error(error?.stack || error); process.exitCode = 1; })
              .finally(() => db.closePool());
          '

          echo "=== Recent API errors (last 24 hours, sanitized tail) ==="
          journalctl -u retiradas-api.service --since '24 hours ago' --no-pager -p err \
            | tail -300 || true

          echo "=== Latest equipment recovery jobs ==="
          psql "$database_target" -X -v ON_ERROR_STOP=1 -P pager=off -c \
            "select mode, status, started_at, finished_at,
                    coalesce(summary->>'total', summary->>'processed', '0') as total,
                    coalesce(summary->>'matched', '0') as matched,
                    coalesce(summary->>'probable', '0') as probable,
                    coalesce(summary->>'stage', '') as stage
               from equipment_recovery_jobs
              order by started_at desc limit 5;"

          echo "=== Reconciliation coverage ==="
          psql "$database_target" -X -v ON_ERROR_STOP=1 -P pager=off -c \
            "select count(*)::int as snapshots,
                    count(*) filter (where return_status = 'MATCHED')::int as matched,
                    (select count(*)::int from movimentacoes_estoque) as movements,
                    (select count(*)::int from movimentacoes_estoque where coalesce(os_numero, '') <> '') as movements_with_os,
                    (select count(*)::int from movimentacoes_estoque where coalesce(parceiro_nome, '') <> '') as movements_with_client
               from equipment_recovery_snapshots;"

          echo "=== Monthly equipment recovery ==="
          psql "$database_target" -X -v ON_ERROR_STOP=1 -P pager=off -c \
            "select to_char(date_trunc('month', closed_at), 'YYYY-MM') as month,
                    count(*)::int as snapshots,
                    count(*) filter (where return_status = 'MATCHED')::int as matched,
                    count(*) filter (where return_status <> 'MATCHED' and equipment_type <> 'UNKNOWN')::int as pending
               from equipment_recovery_snapshots
              group by date_trunc('month', closed_at)
              order by date_trunc('month', closed_at) desc limit 12;"

          if [ -n "$route_id" ]; then
            if ! [[ "$route_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
              echo "Invalid route UUID" >&2
              exit 2
            fi
            echo "=== Route ==="
            psql "$database_target" -X -v ON_ERROR_STOP=1 -P pager=off -c \
              "select route.id, route.status, count(item.order_id)::int as items,
                      count(location.order_id)::int as located,
                      min(item.sequence_number) as first_sequence,
                      max(item.sequence_number) as last_sequence
                 from maps_routes route
                 left join maps_route_items item on item.route_id = route.id
                 left join maps_order_locations location on location.order_id = item.order_id
                where route.id = '$route_id'::uuid
                group by route.id;"
            echo "=== Recent route errors ==="
            journalctl -u retiradas-api.service --since '3 hours ago' --no-pager \
              | grep -F -B 6 -A 14 "$route_id" | tail -100 || true

            if [ "$verify_route_optimization" = "true" ]; then
              echo "=== Deployed route optimizer verification ==="
              cd /opt/retiradas/vps/api
              ROUTE_ID="$route_id" node -e '
                const db = require("./src/db");
                const maps = require("./src/mapsV2/mapsV2Service");
                (async () => {
                  const routeId = process.env.ROUTE_ID;
                  const route = await db.query("select user_id from maps_routes where id = $1", [routeId]);
                  if (!route.rows[0]) throw new Error("Route not found");
                  const result = await maps.optimizeRoute(routeId, {}, { id: route.rows[0].user_id });
                  console.log(JSON.stringify({ ok: true, optimizedItems: result.items.length }));
                })().catch((error) => {
                  console.error(error?.stack || error);
                  process.exitCode = 1;
                }).finally(() => db.closePool());
              '
            fi
          fi
          REMOTE
