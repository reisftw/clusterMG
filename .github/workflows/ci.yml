name: CI

on:
  push:
    branches:
      - main
      - master
      - homolog-dev
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
      - 'chore/**'
  pull_request:

concurrency:
  group: retiradas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vps/package-lock.json

      - name: Install all dependencies
        run: |
          npm ci
          npm ci --prefix vps

      - name: Audit dependencies for high and critical vulnerabilities
        run: npm audit --audit-level=high

      - name: Run Semgrep security scan
        uses: semgrep/semgrep-action@v1
        with:
          config: p/security-audit

      - name: Scan diff for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vps/package-lock.json

      - name: Install all dependencies
        run: |
          npm ci
          npm ci --prefix vps

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build application
        run: |
          if [ "${GITHUB_REF_NAME}" = "homolog-dev" ]; then
            export VITE_APP_ENV_LABEL="Homologação"
          else
            export VITE_APP_ENV_LABEL="Produção"
          fi
          export VITE_APP_VERSION="${GITHUB_SHA::7}"
          npm run build

      - name: Upload frontend build artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@v4
        with:
          name: retiradas-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy-vps:
    name: Deploy frontend to VPS
    runs-on: ubuntu-latest
    needs:
      - security
      - build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    permissions:
      contents: read

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/var/www/retiradas/dist' }}
      REMOTE_PACKAGE: /tmp/retiradas-dist-${{ github.sha }}.tar.gz

    steps:
      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: retiradas-dist
          path: dist

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST" || (echo "Missing secret VPS_HOST" && exit 1)
          test -n "$SSH_PRIVATE_KEY" || (echo "Missing secret VPS_SSH_KEY" && exit 1)

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Package frontend build
        run: tar -czf retiradas-dist.tar.gz -C dist .

      - name: Upload package to VPS
        run: |
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" \
            retiradas-dist.tar.gz \
            "$VPS_USER@$VPS_HOST:$REMOTE_PACKAGE"

      - name: Publish package on VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "set -e
             deploy_path='$VPS_DEPLOY_PATH'
             package='$REMOTE_PACKAGE'
             if [ \"\$(id -u)\" -eq 0 ]; then SUDO=''; else SUDO='sudo -n'; fi
             \$SUDO mkdir -p \"\$deploy_path\"
             \$SUDO tar -xzf \"\$package\" -C \"\$deploy_path\"
             \$SUDO nginx -t
             \$SUDO systemctl reload nginx
             rm -f \"\$package\" || \$SUDO rm -f \"\$package\""
