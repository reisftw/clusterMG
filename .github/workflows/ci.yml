      VPS_PORT: ${{ secrets.PROD_VPS_PORT || secrets.VPS_PORT || secrets.HOMOLOG_VPS_PORT || '22' }}
      VPS_USER: ${{ secrets.PROD_VPS_USER || secrets.VPS_USER || secrets.HOMOLOG_VPS_USER || 'root' }}
      VPS_DEPLOY_PATH: ${{ secrets.PROD_VPS_DEPLOY_PATH || secrets.VPS_DEPLOY_PATH || '/var/www/retiradas/dist' }}
      VPS_API_PATH: ${{ secrets.PROD_VPS_API_PATH || secrets.VPS_API_PATH || '/opt/retiradas/vps' }}
      VPS_API_SERVICE: ${{ secrets.PROD_VPS_API_SERVICE || secrets.VPS_API_SERVICE || 'retiradas-api' }}
      VPS_API_ENV_FILE: ${{ secrets.PROD_VPS_API_ENV_FILE || secrets.VPS_API_ENV_FILE || '/etc/retiradas/api.env' }}
      REMOTE_FRONTEND_PACKAGE: /tmp/retiradas-dist-${{ github.sha }}.tar.gz
      REMOTE_BACKEND_PACKAGE: /tmp/retiradas-vps-${{ github.sha }}.tar.gz

