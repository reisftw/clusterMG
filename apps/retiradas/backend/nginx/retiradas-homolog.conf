server {
    listen 80;
    server_name homolog.retiradas.tech;

    root /var/www/retiradas-homolog/dist;
    index index.html;

    # Padrao do nginx e 1m — pequeno demais pra upload de planilha (ex.:
    # conciliacao de Ordens Fechadas em Movimentacoes, milhares de linhas em
    # JSON). Mesmo limite do Express (JSON_BODY_LIMIT, default 10mb em
    # app.js) com folga.
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host homolog.retiradas.tech;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
