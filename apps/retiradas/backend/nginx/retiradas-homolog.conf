server {
    server_name homolog.retiradas.tech;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
    client_max_body_size 0;

    root /var/www/retiradas-homolog/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host homolog.retiradas.tech;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/homolog.retiradas.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homolog.retiradas.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = homolog.retiradas.tech) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name homolog.retiradas.tech;
    return 404;
}
