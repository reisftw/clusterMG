# Included by the HTTPS server and every location that defines add_header.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://accounts.google.com https://challenges.cloudflare.com https://unpkg.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com https://unpkg.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://brasilapi.com.br https://nominatim.openstreetmap.org https://*.tile.openstreetmap.org https://tiles.openfreemap.org https://*.openfreemap.org https://accounts.google.com https://challenges.cloudflare.com wss:; frame-src 'self' blob: https://accounts.google.com https://challenges.cloudflare.com https://www.google.com https://drive.google.com; frame-ancestors 'self'; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'; upgrade-insecure-requests" always;
