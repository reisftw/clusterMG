# Source of truth for /etc/nginx/sites-available/retiradas.
# The official release workflow installs this file with a tested rollback.
server {
	server_name retiradas.tech www.retiradas.tech;
	server_tokens off;

	include /etc/nginx/snippets/retiradas-security-headers.conf;
	client_max_body_size 200M;

	root /var/www/retiradas/dist;
	index index.html;

	location = /mercado { return 302 https://mercado.retiradas.tech/mercado; }
	location = /mercado/ { return 302 https://mercado.retiradas.tech/mercado; }
	location ^~ /mercado/ { return 302 https://mercado.retiradas.tech$request_uri; }

	location /assets/ {
		try_files $uri =404;
		access_log off;
		expires 1y;
		include /etc/nginx/snippets/retiradas-security-headers.conf;
		add_header Cache-Control "public, immutable" always;
	}

	location = /sw.js {
		try_files $uri =404;
		include /etc/nginx/snippets/retiradas-security-headers.conf;
		add_header Cache-Control "no-cache, no-store, must-revalidate" always;
	}

	location = /manifest.webmanifest {
		try_files $uri =404;
		include /etc/nginx/snippets/retiradas-security-headers.conf;
		add_header Cache-Control "no-cache" always;
	}

	location /api/ {
		proxy_pass http://127.0.0.1:3001/api/;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		# Keep Nginx from duplicating the headers already emitted by Helmet.
		add_header Cache-Control "no-store" always;
	}

	location / {
		include /etc/nginx/snippets/retiradas-security-headers.conf;
		add_header Cache-Control "no-cache, no-store, must-revalidate" always;
		add_header Pragma "no-cache" always;
		add_header Expires "0" always;
		try_files $uri $uri/ /index.html;
	}

	listen 443 ssl; # managed by Certbot
	ssl_certificate /etc/letsencrypt/live/retiradas.tech/fullchain.pem; # managed by Certbot
	ssl_certificate_key /etc/letsencrypt/live/retiradas.tech/privkey.pem; # managed by Certbot
	include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
	if ($host = www.retiradas.tech) {
		return 301 https://$host$request_uri;
	}

	if ($host = retiradas.tech) {
		return 301 https://$host$request_uri;
	}

	listen 80;
	server_name retiradas.tech www.retiradas.tech;
	return 404;
}
