# Marketplace isolado. Requer certificado válido antes de habilitar o bloco HTTPS.
server {
    listen 80;
    server_name mercado.retiradas.tech;
    return 301 https://mercado.retiradas.tech$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mercado.retiradas.tech;
    server_tokens off;
    client_max_body_size 12m;
    root /var/www/mercado/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/mercado.retiradas.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mercado.retiradas.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /assets/ { try_files $uri =404; access_log off; expires 1y; add_header Cache-Control "public, immutable" always; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
}
