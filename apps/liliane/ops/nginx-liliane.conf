location = /liliane { return 301 /liliane/; }

location ^~ /liliane/api/ {
  proxy_pass http://127.0.0.1:3401/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  add_header Cache-Control "no-store" always;
}

location = /liliane/ {
  root /opt/liliane/current/frontend;
  try_files /index.html =404;
  add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location = /liliane/liliane-sw.js {
  alias /opt/liliane/current/frontend/liliane-sw.js;
  default_type application/javascript;
  add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location ^~ /liliane/assets/ {
  alias /opt/liliane/current/frontend/assets/;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ^~ /liliane/ { return 302 /liliane/; }
