services:
  evolution:
    image: evoapicloud/evolution-api@sha256:966625532d9076a2381e973a271307d107e6f070450de3abeeea8bd18be07252
    container_name: liliane_evolution_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      SERVER_URL: ${LILI_EVOLUTION_PUBLIC_URL}
      AUTHENTICATION_API_KEY: ${LILI_EVOLUTION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${LILI_EVOLUTION_DB_USER}:${LILI_EVOLUTION_DB_PASSWORD}@postgres:5432/${LILI_EVOLUTION_DB_NAME}
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/0
      CACHE_LOCAL_ENABLED: "false"
      LOG_LEVEL: ERROR,WARN,INFO
      TZ: America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - evolution_instances:/evolution/instances

  postgres:
    image: postgres:16-alpine
    container_name: liliane_evolution_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LILI_EVOLUTION_DB_USER}
      POSTGRES_PASSWORD: ${LILI_EVOLUTION_DB_PASSWORD}
      POSTGRES_DB: ${LILI_EVOLUTION_DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LILI_EVOLUTION_DB_USER} -d ${LILI_EVOLUTION_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - evolution_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: liliane_evolution_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - evolution_redis:/data

volumes:
  evolution_instances:
  evolution_postgres:
  evolution_redis:
